<body>
<style>
/* Pretendard (SIL OFL 1.1, github.com/orioncactus/pretendard) — variable font, subset to the glyphs this app uses */
@font-face { font-family: "Pretendard"; src: url(fonts/pretendard-subset.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
/* Layout: one study column. Header + section tabs (plan / sentences / tips), then the active section. */
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #18212B; --muted: #5B6875; --line: #D5DCE3;
  --rec: #D9363E; --rec-soft: #FBE3E4; --ok: #1F7A55; --ok-soft: #DDF1E7;
  --slot-bg: #FFEDB8; --slot-ink: #6B4A00; --miss: #B4232A; --info: #2D5BA8; --info-soft: #E2EAF7;
  --f-display: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161C; --surface: #1A2129; --ink: #E7ECF1; --muted: #95A2AF; --line: #2B3540;
  --rec: #FF5C63; --rec-soft: #3A1E22; --ok: #4CC38A; --ok-soft: #16302A;
  --slot-bg: #3A3014; --slot-ink: #F3D27A; --miss: #FF7A80; --info: #8FB4F0; --info-soft: #1C2A40; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161C; --surface: #1A2129; --ink: #E7ECF1; --muted: #95A2AF; --line: #2B3540;
  --rec: #FF5C63; --rec-soft: #3A1E22; --ok: #4CC38A; --ok-soft: #16302A;
  --slot-bg: #3A3014; --slot-ink: #F3D27A; --miss: #FF7A80; --info: #8FB4F0; --info-soft: #1C2A40; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--info); }
button:focus-visible, textarea:focus-visible, .card:focus-visible, a:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.rec { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--rec); display: flex; align-items: center; gap: 8px; }
.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; margin: 6px 0 0; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.meter { min-width: 200px; flex: 0 1 240px; }
.meter-num { font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter-num small { font-size: 14px; color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.nav button { border: 0; background: none; padding: 10px 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; display: grid; gap: 1px; }
.chip b { font-weight: 600; font-size: 14px; }
.chip span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; user-select: none; cursor: pointer; }
.toggle input { accent-color: var(--rec); width: 16px; height: 16px; }
.hint-line { font-size: 13px; color: var(--muted); margin: 0; }

.tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: .03em; color: var(--muted); }
.src { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; background: var(--info-soft); color: var(--info); white-space: nowrap; }
.en { font-family: var(--f-display); font-weight: 500; line-height: 1.35; }
mark.slot { background: var(--slot-bg); color: var(--slot-ink); padding: 0 .2em; border-radius: 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.good { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; }
.btn.again { background: var(--rec-soft); color: var(--rec); border-color: transparent; font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 36px; height: 36px; display: inline-grid; place-items: center; flex: 0 0 auto; }
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.tipline { font-size: 13px; color: var(--info); margin: 0; }
.tipline::before { content: "TIP "; font-family: var(--f-mono); font-size: 11px; font-weight: 500; }

.deck-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px; min-height: 290px;
  display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 32px -22px rgba(0,0,0,.35); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-head .left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.known-pill { font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-soft); border-radius: 99px; padding: 2px 10px; }
.card-ko { font-size: clamp(19px, 4.4vw, 23px); font-weight: 500; margin: 0; line-height: 1.5; }
.card-en-wrap { border-top: 1px dashed var(--line); padding-top: 16px; margin-top: auto; display: grid; gap: 10px; }
.card-en-row { display: flex; gap: 12px; align-items: flex-start; }
.card-en { font-size: clamp(21px, 4.8vw, 27px); margin: 0; flex: 1; min-width: 0; }
.reveal { margin-top: auto; border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 16px; color: var(--muted); }
.card-actions { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px; }
.kbd { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.kbd kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }

.group-title { font-family: var(--f-display); font-size: 17px; font-weight: 700; margin: 10px 0 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 13px 14px; align-items: start; }
.row + .row { border-top: 1px solid var(--line); }
.row .text { min-width: 0; display: grid; gap: 2px; }
.row .en { font-size: 17px; margin: 0; }
.row .ko { color: var(--muted); margin: 0; font-size: 14px; }
.masked .en:not(.peek) { color: transparent; background: repeating-linear-gradient(90deg, var(--line) 0 70%, transparent 70% 100%); background-size: 14px 100%; border-radius: 4px; cursor: pointer; }
.masked .en:not(.peek) mark.slot { background: none; color: transparent; }
.check { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); background: none; display: grid; place-items: center; margin-top: 2px; padding: 0; }
.check svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; opacity: 0; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check[aria-pressed="true"] svg { opacity: 1; }

.test { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 14px; }
.test .card-ko { font-size: 20px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font: 500 18px/1.45 var(--f-display); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.result { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 16px; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.score.pass { color: var(--ok); } .score.fail { color: var(--rec); }
.answer { font-size: 20px; margin: 0; }
.answer .hit { color: var(--ok); }
.answer .miss { color: var(--miss); text-decoration: underline wavy; text-underline-offset: 4px; }
.answer .free { background: var(--slot-bg); color: var(--slot-ink); border-radius: 4px; padding: 0 .15em; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.hint { font-family: var(--f-mono); font-size: 14px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* plan */
.plan { display: grid; gap: 12px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.block-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.block-head .hrs { font-family: var(--f-mono); font-size: 12px; color: var(--rec); font-variant-numeric: tabular-nums; }
.block.done { border-color: var(--ok); }
.block.done .hrs { color: var(--ok); }
.task { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.task p { margin: 0; }
.task.on p { color: var(--muted); text-decoration: line-through; }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; }
.lead ul, .tipcard ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }

/* tips */
.timer { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.timer .tag { color: inherit; opacity: .7; }
.timer-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.timer-presets button { border: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); background: none; color: inherit; border-radius: 8px; padding: 5px 11px; font-size: 14px; }
.timer-presets button[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: #fff; }
.clock { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.clock b { font-family: var(--f-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock span { font-size: 17px; font-weight: 600; }
.clock.speak span { color: var(--rec); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.steps i { font-style: normal; font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); opacity: .6; }
.steps i.now { opacity: 1; background: var(--rec); border-color: var(--rec); color: #fff; }
.steps i.past { opacity: .35; text-decoration: line-through; }
.timer .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.timer .btn.ghost { background: none; color: inherit; border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.tips { display: grid; gap: 14px; }
.tipcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.tipcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tipcard h4 { font-size: 13px; font-weight: 600; margin: 0 0 4px; color: var(--muted); letter-spacing: .02em; }
.tipcard .warn li::marker { color: var(--rec); }
.tipcard code, .lead code { font-family: var(--f-display); font-size: 15px; font-weight: 500; }
.ex { background: var(--bg); border-radius: 10px; padding: 12px 14px; font-family: var(--f-display); font-size: 15.5px; line-height: 1.5; display: grid; gap: 3px; }
.ex span { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td code { font-size: 14px; }
.links { display: grid; gap: 4px; font-size: 14px; }

@media (max-width: 480px) {
  .card { padding: 22px 18px; min-height: 260px; }
  .card-actions { grid-template-columns: 1fr 1fr; }
  .card-actions .navbtn { display: none; }
  .row { gap: 10px; padding: 12px; }
  .clock b { font-size: 46px; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="rec">TOEIC SPEAKING · IM1 · 24H</div>
      <h1>무적문장 110</h1>
      <p class="sub">시계토끼 강의 3시간 반, 만능문장 313개, 2주 IH 후기를 합쳐 24시간 안에 IM1을 만드는 순서대로 정리했어요.</p>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-num"><span id="knownCount">0</span> <small>/ <span id="totalCount">0</span> 핵심 문장 외움</small></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </header>

  <nav class="nav" role="tablist" aria-label="메뉴">
    <button role="tab" data-view="plan" id="nav-plan">24시간 플랜</button>
    <button role="tab" data-view="sentences" id="nav-sentences">만능문장</button>
    <button role="tab" data-view="tips" id="nav-tips">꿀팁·타이머</button>
  </nav>

  <section id="view-plan" hidden></section>
  <section id="view-sentences" hidden>
    <div style="display:grid;gap:14px">
      <div class="chips" id="chips" aria-label="파트 선택"></div>
      <div class="toolbar">
        <div class="seg" id="levelSeg" aria-label="범위">
          <button data-level="tpl">필수 템플릿</button><button data-level="core">핵심</button><button data-level="all">전체</button>
        </div>
        <label class="toggle"><input type="checkbox" id="onlyLeft"> 못 외운 문장만</label>
      </div>
      <div class="toolbar">
        <div class="seg" id="modeSeg" aria-label="학습 방식">
          <button data-mode="card">카드</button><button data-mode="list">목록</button><button data-mode="test">쓰기 테스트</button>
        </div>
        <p class="hint-line"><mark class="slot">노란 부분</mark>은 문제에 맞게 바꿔 끼우는 자리</p>
      </div>
      <div id="studyArea"></div>
    </div>
  </section>
  <section id="view-tips" hidden></section>
</div>

/* ---------- storage (this browser only) ---------- */
function load(key, fb) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
function store(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const fmtEn = s => esc(s).replace(/\[([^\]]+)\]/g, '<mark class="slot">$1</mark>');
const fmtKo = s => esc(s).replace(/\[([^\]]+)\]/g, "<b>$1</b>");
const plain = s => s.replace(/[\[\]]/g, "");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* typing test: only fixed template words are graded; slot words are free */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'$]/g, "");
function tokens(en) {
  const out = [];
  en.split(/(\[[^\]]+\])/).forEach(seg => {
    if (!seg) return; const slot = seg.startsWith("[");
    (slot ? seg.slice(1, -1) : seg).split(/\s+/).forEach(w => { if (w) out.push({ w, n: norm(w), slot }); });
  });
  return out;
}
function grade(input, en) {
  const toks = tokens(en);
  const fixed = toks.map((t, i) => [t, i]).filter(([t]) => !t.slot && t.n);
  const user = input.split(/\s+/).map(norm).filter(Boolean);
  const a = fixed.map(([t]) => t.n), n = a.length, m = user.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === user[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === user[j]) { hit.add(fixed[i][1]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return { toks, hit, score: n ? Math.round(hit.size / n * 100) : 100 };
}
function newTest() { const pool = filtered(); state.test = pool.length ? { id: pool[Math.floor(Math.random() * pool.length)].id, result: null, hint: false, input: "" } : null; }
function renderTest() {
  const area = $("#studyArea");
  if (!state.test || !filtered().some(d => d.id === state.test.id)) newTest();
  if (!state.test) { area.innerHTML = emptyMsg(); return; }
  const t = state.test, d = byId(t.id);
  const hint = tokens(d.en).map(x => x.slot ? "＿" : x.w[0] + "·".repeat(Math.max(0, x.w.length - 1))).join(" ");
  let res = "";
  if (t.result) {
    const { toks, hit, score } = t.result; const pass = score >= 85;
    res = `<div class="result" aria-live="polite">
      <div class="score ${pass ? "pass" : "fail"}">${score}% ${pass ? "통과" : "한 번 더"}</div>
      <div style="display:flex;gap:12px;align-items:flex-start"><p class="en answer" style="flex:1;min-width:0">${toks.map((x, i) => `<span class="${x.slot ? "free" : hit.has(i) ? "hit" : "miss"}">${esc(x.w)}</span>`).join(" ")}</p>${speakBtn(d.id)}</div>
      ${d.tip ? `<p class="tipline">${esc(d.tip)}</p>` : ""}
      <p class="note">초록은 맞힌 단어, 빨간 밑줄은 빠졌거나 틀린 단어예요. 노란 부분은 자유롭게 바꿔 써도 채점하지 않아요.</p>
      <div class="actions">${pass && !known.has(d.id) ? `<button class="btn good" id="testKnow">외움으로 표시</button>` : ""}<button class="btn primary" id="testNext">다음 문제</button></div></div>`;
  }
  area.innerHTML = `<section class="test">${head(d)}
      <p class="card-ko">${fmtKo(d.ko)}</p>
      <textarea id="testInput" placeholder="영어 문장을 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(t.input)}</textarea>
      ${t.hint ? `<p class="hint">${esc(hint)}</p>` : ""}
      ${t.result ? "" : `<div class="actions"><button class="btn primary" id="testCheck">채점하기 <span class="tag" style="color:inherit;opacity:.7">Enter</span></button><button class="btn" id="testHint">첫 글자 힌트</button><button class="btn" id="testSkip">건너뛰기</button></div>`}
      ${res}</section>`;
  if (!t.result) { const ta = $("#testInput"); ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

const TIMERS = {
  q12:  { name: "Q1–2", steps: [["Q1 준비", 45], ["Q1 답변", 45], ["Q2 준비", 45], ["Q2 답변", 45]] },
  q34:  { name: "Q3–4", steps: [["Q3 준비", 45], ["Q3 답변", 30], ["Q4 준비", 45], ["Q4 답변", 30]] },
  q57:  { name: "Q5–7", steps: [["Q5 준비", 3], ["Q5 답변", 15], ["Q6 준비", 3], ["Q6 답변", 15], ["Q7 준비", 3], ["Q7 답변", 30]] },
  q810: { name: "Q8–10", steps: [["표 읽기", 45], ["Q8 준비", 3], ["Q8 답변", 15], ["Q9 준비", 3], ["Q9 답변", 15], ["Q10 준비", 3], ["Q10 답변", 30]] },
  q11:  { name: "Q11", steps: [["Q11 준비", 45], ["Q11 답변", 60]] }
};
TIMERS.all = { name: "Q1–11 전체", steps: [].concat(...["q12", "q34", "q57", "q810", "q11"].map(k => TIMERS[k].steps)) };
const timer = { key: "q34", idx: -1, end: 0, tick: null, ctx: null };
function beep(high) {
  try {
    if (!timer.ctx) timer.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = timer.ctx.createOscillator(), g = timer.ctx.createGain();
    o.frequency.value = high ? 1046 : 784; o.connect(g); g.connect(timer.ctx.destination);
    g.gain.setValueAtTime(.15, timer.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, timer.ctx.currentTime + .35);
    o.start(); o.stop(timer.ctx.currentTime + .36);
  } catch (e) {}
}
function timerStart() { timerStop(); timer.idx = 0; timer.end = Date.now() + TIMERS[timer.key].steps[0][1] * 1000; beep(false); timer.tick = setInterval(timerLoop, 200); timerPaint(); }
function timerStop() { clearInterval(timer.tick); timer.tick = null; timer.idx = -1; timerPaint(); }
function timerLoop() {
  const steps = TIMERS[timer.key].steps;
  if (Date.now() >= timer.end) {
    timer.idx++;
    if (timer.idx >= steps.length) { beep(true); timerStop(); return; }
    timer.end = Date.now() + steps[timer.idx][1] * 1000; beep(steps[timer.idx][0].includes("답변"));
  }
  timerPaint();
}
function timerPaint() {
  const el = $("#timerBox"); if (!el) return;
  const steps = TIMERS[timer.key].steps; const running = timer.idx >= 0;
  const cur = running ? steps[timer.idx] : steps[0];
  const left = running ? Math.max(0, Math.ceil((timer.end - Date.now()) / 1000)) : cur[1];
  el.querySelector(".clock").className = "clock" + (running && cur[0].includes("답변") ? " speak" : "");
  el.querySelector(".clock b").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  el.querySelector(".clock span").textContent = running ? (cur[0].includes("답변") ? cur[0] + " · Begin speaking now" : cur[0]) : "시작을 누르면 실제 시험 순서대로 넘어가요";
  el.querySelector(".steps").innerHTML = steps.map((s, i) => `<i class="${i === timer.idx ? "now" : i < timer.idx ? "past" : ""}">${esc(s[0])} ${s[1]}s</i>`).join("");
  el.querySelector("#timerGo").textContent = running ? "처음부터" : "시작";
  el.querySelectorAll(".timer-presets button").forEach(b => b.setAttribute("aria-pressed", b.dataset.timer === timer.key));
}

function renderTips() {
  const presets = ["q12", "q34", "q57", "q810", "q11", "all"].map(k => `<button data-timer="${k}">${TIMERS[k].name}</button>`).join("");
  let html = `<div class="tips">
    <div class="timer" id="timerBox"><div class="deck-meta"><span class="tag">실전 타이머 · 녹음 앱을 켜고 같이 쓰세요</span></div>
      <div class="timer-presets">${presets}</div>
      <div class="clock"><b>0:45</b><span></span></div>
      <div class="steps"></div>
      <div class="actions"><button class="btn" id="timerGo">시작</button><button class="btn ghost" id="timerStop">정지</button></div></div>

    <div class="lead"><h2>IM1(110점) 전략</h2><ul>
      <li><b>11문제 전부 무언가를 말하세요.</b> 무응답이 가장 큰 손해예요.</li>
      <li><b>쉬운 문장, 외운 문장.</b> 강의 기준으로 IM3~IH도 '문제에 맞는 답을 알아듣게'면 충분하다고 해요. IM1은 템플릿을 틀리지 않고 끝까지 말하는 데 집중하세요.</li>
      <li><b>동문서답 금지.</b> 외운 문장의 노란 자리를 문제 단어로 바꿔 끼우세요.</li>
      <li><b>크고 자신 있게.</b> 모노톤·작은 목소리는 모든 파트에서 감점이에요.</li>
      <li><b>시제 조심.</b> 경험은 과거형, 지금도 하는 일은 has worked.</li>
      <li><b>Q11은 반드시 이유 1 + 예시 1.</b> 배점이 가장 커요.</li></ul></div>`;
  TIPS.forEach(t => {
    html += `<article class="tipcard" id="tip-${t.id}"><div class="tipcard-head"><h2>${t.q} ${t.name}</h2><button class="btn sm" data-settimer="${t.id}">이 파트 타이머</button></div>
      <p class="tag" style="margin:0">${t.time}</p>
      <div><h4>이렇게 하세요</h4><ul>${t.do.map(x => `<li>${x}</li>`).join("")}</ul></div>
      <div><h4>조심하세요</h4><ul class="warn">${t.warn.map(x => `<li>${x}</li>`).join("")}</ul></div>
      ${t.id !== "q12" ? `<button class="btn sm" data-jump="sentences|${t.id}|tpl" style="justify-self:start">이 파트 필수 템플릿 외우기</button>` : ""}</article>`;
  });
  html += `
    <article class="tipcard"><h2>발음·강세 체크</h2>
      <div class="tbl-wrap"><table><thead><tr><th>소리</th><th>방법</th><th>연습 단어</th></tr></thead><tbody>
        <tr><td>R</td><td>'우'로 시작해 혀를 뒤로 당겨요</td><td><code>ready, around, garden</code></td></tr>
        <tr><td>L</td><td>혀끝을 윗니 뒤 잇몸에 찍고 '얼'로 시작</td><td><code>last, also, welcome</code></td></tr>
        <tr><td>F</td><td>윗니로 아랫입술 살짝, 바람만 (성대 X)</td><td><code>flowers, photos, physical, phone</code></td></tr>
        <tr><td>V</td><td>F와 같은 입 모양 + 성대 울림</td><td><code>various</code></td></tr>
        <tr><td>th</td><td>혀를 이 사이에 두고 바람</td><td><code>thank you, thirty</code></td></tr>
        <tr><td>'으' 빼기</td><td>한국어 '으'를 약하게</td><td><code>smartphone, apartment</code></td></tr>
      </tbody></table></div>
      <p class="note">강세 주의: <b>I</b>tem · be<b>GIN</b> · <b>WEL</b>come · <b>SIG</b>nature · <b>MIN</b>ute · <b>VA</b>rious · ap<b>PROX</b>imately · con<b>VE</b>nient · em<b>PLOY</b>ees · ef<b>FI</b>ciently · pro<b>DUC</b>tively · ex<b>PE</b>rience · ma<b>JOR</b>ity · a<b>GREE</b></p></article>

    <article class="tipcard"><h2>Q8–10 전치사</h2>
      <div class="tbl-wrap"><table><thead><tr><th>쓰임</th><th>전치사</th><th>예</th></tr></thead><tbody>
        <tr><td>날짜·요일</td><td>on</td><td><code>on October 24th, on Mondays</code></td></tr>
        <tr><td>시각</td><td>at</td><td><code>at 9 a.m., at noon</code></td></tr>
        <tr><td>특정 장소·주소</td><td>at</td><td><code>at Hilton Hotel, at 1330 Main Street</code></td></tr>
        <tr><td>방·도시·나라·연도</td><td>in</td><td><code>in Room 105, in Seoul, in 2010</code></td></tr>
        <tr><td>기간</td><td>from ~ to</td><td><code>from 9:30 to 10 a.m.</code></td></tr>
        <tr><td>주제</td><td>on</td><td><code>a workshop on marketing</code></td></tr>
        <tr><td>진행자 / 함께 하는 사람</td><td>by / with</td><td><code>by Ray Kingston / with Jane White</code></td></tr>
        <tr><td>출신 회사·학교 / 직책</td><td>from / as</td><td><code>from B Systems / as a director</code></td></tr>
        <tr><td>비행편</td><td>on</td><td><code>on American Air 105</code></td></tr>
      </tbody></table></div></article>

    <article class="tipcard"><h2>시험 당일 체크리스트</h2><ul>
      <li>시험장 기기가 낡으면 옆 사람 목소리가 크게 들려요. 후기를 보고 시험장을 고르세요.</li>
      <li>옆 사람이 먼저 끝나도 신경 쓰지 말고 내 속도로.</li>
      <li>시험 직전에 모의고사 1회로 입 풀기.</li>
      <li>필수 템플릿 첫 문장들만 한 번 더 소리 내 읽기: Q3 첫 두 줄, Q7 첫 줄, Q8 <code>It will be held</code>, Q11 첫 세 줄.</li>
      <li>문법을 틀릴 것 같으면 더 쉬운 문장으로. 멈추지만 말기.</li></ul></article>

    <article class="tipcard"><h2>자료 출처</h2><div class="links">
      <a href="https://youtu.be/CHCq0vh6Frg" target="_blank" rel="noopener">시계토끼제니쌤 · 파트별 핵심 강의 (노베이스 3시간 반)</a>
      <a href="https://youtu.be/ZzyolBABSIw" target="_blank" rel="noopener">시계토끼 Part 2~5 만능문장 (문장 데이터 출처)</a>
      <a href="https://community.linkareer.com/jayuu/4297635" target="_blank" rel="noopener">링커리어 · 노베이스 2주 독학 IH 후기</a>
      <a href="https://youtu.be/KZZvBoU5n9Y" target="_blank" rel="noopener">모의고사 5회 (풀이 포함)</a>
      <a href="https://youtu.be/JhB1x9CdQ8c" target="_blank" rel="noopener">모의고사 15회</a>
      <a href="https://www.youtube.com/watch?v=ZsPVQxscHBQ" target="_blank" rel="noopener">5일 벼락치기</a></div>
      <p class="note">'보충' 표시 문장은 강의·후기에 없어서 Q5–6 의문사 답변용으로 추가한 문장이에요.</p></article>
  </div>`;
  $("#view-tips").innerHTML = html;
  timerPaint();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-peek]"); if (!el) return;
  const ds = el.dataset;
  if (ds.speak) { speak(byId(ds.speak).en); return; }
  if (ds.view) { go(ds.view, true); return; }
  if (ds.part) { state.part = ds.part; rebuildOrder(false); renderChips(); renderStudy(); return; }
  if (ds.level) { state.level = ds.level; rebuildOrder(false); renderChips(); renderStudy(); return; }
  if (ds.mode) { state.mode = ds.mode; renderChips(); renderStudy(); return; }
  if (ds.check) { setKnown(ds.check, !known.has(ds.check)); if (state.onlyLeft) rebuildOrder(false); renderList(); return; }
  if (ds.plan) { planDone.has(ds.plan) ? planDone.delete(ds.plan) : planDone.add(ds.plan); store("toeic-im1-plan", [...planDone]); renderPlan(); return; }
  if (ds.peek && state.masked) { state.peek.has(ds.peek) ? state.peek.delete(ds.peek) : state.peek.add(ds.peek); el.classList.toggle("peek"); return; }
  if (ds.timer) { timer.key = ds.timer; timerStop(); return; }
  if (ds.settimer) { timer.key = ds.settimer; timerStop(); $("#timerBox").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (ds.jump) {
    const [view, a, b] = ds.jump.split("|");
    if (view === "sentences") { const [part, level] = b ? [a, b] : [a, "core"]; state.part = part; state.level = level; state.mode = "card"; rebuildOrder(false); go("sentences", true); }
    else { go("tips", true); if (a) { timer.key = a; timerStop(); } requestAnimationFrame(() => { const t = $("#timerBox"); if (t) t.scrollIntoView({ block: "start" }); }); }
    window.scrollTo({ top: 0 });
    return;
  }
  switch (el.id) {
    case "revealBtn": state.revealed = true; renderCard(); break;
    case "prevBtn": cardStep(-1); break;
    case "nextBtn": cardStep(1); break;
    case "knowBtn": cardMark(true); break;
    case "againBtn": cardMark(false); break;
    case "shuffleBtn": rebuildOrder(true); renderCard(); break;
    case "testCheck": checkTest(); break;
    case "testHint": state.test.input = $("#testInput").value; state.test.hint = true; renderTest(); break;
    case "testSkip": case "testNext": newTest(); renderTest(); break;
    case "testKnow": setKnown(state.test.id, true); newTest(); renderTest(); break;
    case "timerGo": timerStart(); break;
    case "timerStop": timerStop(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "onlyLeft") { state.onlyLeft = e.target.checked; rebuildOrder(false); renderChips(); renderStudy(); }
  if (e.target.id === "maskToggle") { state.masked = e.target.checked; state.peek.clear(); renderList(); }
});
document.addEventListener("keydown", e => {
  if (state.view !== "sentences") return;
  if (state.mode === "test") {
    if (e.target.id === "testInput" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); checkTest(); }
    else if (e.key === "Enter" && state.test && state.test.result && e.target.tagName !== "BUTTON") { e.preventDefault(); newTest(); renderTest(); }
    return;
  }
  if (state.mode !== "card" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === " ") { if (e.target.tagName === "BUTTON") return; e.preventDefault(); state.revealed = !state.revealed; renderCard(); }
  else if (e.key === "ArrowRight") cardStep(1);
  else if (e.key === "ArrowLeft") cardStep(-1);
  else if (e.key === "k" || e.key === "K") cardMark(true);
  else if (e.key === "j" || e.key === "J") cardMark(false);
});

rebuildOrder(false); renderMeter(); go(fromHash(), false);
</script>
